name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24.22.1'  # Must match macapp/build.sh NODE_VERSION

jobs:
  get-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

          # Validate tag matches package.json (only on tag pushes)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/v}"
            if [ "$TAG" != "$VERSION" ]; then
              echo "ERROR: Tag v${TAG} does not match package.json version ${VERSION}"
              exit 1
            fi
          fi

  generate-notes:
    needs: get-version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Generate release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"

          mkdir -p sync-output

          # Extract changelog entry for this version from CHANGELOG.md
          VER_ESCAPED="${VERSION//./\\.}"
          awk "/^## v${VER_ESCAPED}/{found=1; next} found && /^## v/{exit} found" CHANGELOG.md > sync-output/changelog-entry.md

          # Sync Info.plist version (only CFBundleVersion and CFBundleShortVersionString)
          cp macapp/Info.plist sync-output/Info.plist
          sed -i "/CFBundleVersion/{n;s|<string>[0-9.]*</string>|<string>${VERSION}</string>|}" sync-output/Info.plist
          sed -i "/CFBundleShortVersionString/{n;s|<string>[0-9.]*</string>|<string>${VERSION}</string>|}" sync-output/Info.plist

          # Update SECURITY.md
          MAJOR_MINOR="${VERSION%.*}"
          awk -v ver="${MAJOR_MINOR}.x" '
          /\| Version \| Supported \|/ {
              print; getline; print
              print "| " ver "   | Yes       |"
              next
          }
          /\| Yes/ && !done {
              gsub(/\| Yes/, "| No")
              done = 1
          }
          { print }
          ' SECURITY.md > sync-output/SECURITY.md

          echo "Generated release notes and synced files for v${VERSION}"

      - name: Upload sync artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sync-files
          path: sync-output/

  build-linux:
    needs: [get-version, generate-notes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Node.js
        uses: actions/cache@v6
        with:
          path: .node-cache
          key: node-linux-x64-${{ env.NODE_VERSION }}

      - name: Download Node.js
        run: |
          mkdir -p .node-cache
          TARBALL=".node-cache/node-v${NODE_VERSION}-linux-x64.tar.gz"
          if [ ! -f "$TARBALL" ]; then
            curl -L "https://nodejs.org/dist/v${NODE_VERSION}/node-v${NODE_VERSION}-linux-x64.tar.gz" -o "$TARBALL"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Assemble bundle
        run: |
          NAME="JellyfinMPVPlay-Linux-v${{ needs.get-version.outputs.version }}"
          mkdir -p "$NAME/node" "$NAME/images"

          tar -xzf ".node-cache/node-v${NODE_VERSION}-linux-x64.tar.gz" -C .node-cache
          cp -R .node-cache/node-v${NODE_VERSION}-linux-x64/bin "$NAME/node/"
          cp -R .node-cache/node-v${NODE_VERSION}-linux-x64/lib "$NAME/node/"
          rm -rf "$NAME/node/lib/node_modules/npm" \
                 "$NAME/node/lib/node_modules/corepack" \
                 "$NAME/node/bin/npm" \
                 "$NAME/node/bin/npx" \
                 "$NAME/node/bin/corepack" 2>/dev/null || true

          cp shim.js package.json config.example.js "$NAME/"
          cp -R node_modules "$NAME/"
          cp -R linux/* "$NAME/"
          cp images/icon.svg "$NAME/images/"
          chmod +x "$NAME/launch.sh"

          tar -czf "${NAME}.tar.gz" "$NAME"
          echo "BUNDLE=${NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: linux-bundle
          path: ${{ env.BUNDLE }}

  build-windows:
    needs: [get-version, generate-notes]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Cache Node.js
        uses: actions/cache@v6
        with:
          path: .node-cache
          key: node-win-x64-${{ env.NODE_VERSION }}

      - name: Download Node.js
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .node-cache | Out-Null
          $zip = ".node-cache/node-v${{ env.NODE_VERSION }}-win-x64.zip"
          if (-not (Test-Path $zip)) {
            Invoke-WebRequest -Uri "https://nodejs.org/dist/v${{ env.NODE_VERSION }}/node-v${{ env.NODE_VERSION }}-win-x64.zip" -OutFile $zip
          }
          Write-Output "NODE_ZIP=$zip" >> $env:GITHUB_ENV

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Assemble bundle
        shell: pwsh
        run: |
          $ver = "${{ needs.get-version.outputs.version }}"
          $name = "JellyfinMPVPlay-Windows-v$ver"
          New-Item -ItemType Directory -Force -Path "$name/node" | Out-Null

          Expand-Archive -Path "${{ env.NODE_ZIP }}" -DestinationPath .node-cache -Force
          $nodeDir = ".node-cache/node-v${{ env.NODE_VERSION }}-win-x64"
          Copy-Item "$nodeDir/node.exe" "$name/node/"
          Copy-Item "$nodeDir/*.dll" "$name/node/"

          Copy-Item shim.js, package.json, config.example.js "$name/"
          Copy-Item -Recurse node_modules "$name/"
          Copy-Item -Recurse windows/* "$name/"

          Compress-Archive -Path "$name" -DestinationPath "$name.zip"
          Write-Output "BUNDLE=$name.zip" >> $env:GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: ${{ env.BUNDLE }}

  build-macos:
    needs: [get-version, generate-notes]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Sync Info.plist version
        run: |
          VERSION="${{ needs.get-version.outputs.version }}"
          # Use perl with -0777 to slurp entire file (sed on macOS doesn't support multi-line)
          perl -0777 -i -pe "s|(<key>CFBundleVersion</key>\\s*<string>)[^<]*(</string>)|\${1}${VERSION}\$2|" macapp/Info.plist
          perl -0777 -i -pe "s|(<key>CFBundleShortVersionString</key>\\s*<string>)[^<]*(</string>)|\${1}${VERSION}\$2|" macapp/Info.plist
          echo "Synced Info.plist to version $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Build macOS app
        run: |
          cd macapp
          ./build.sh

      - name: Create archive
        run: |
          NAME="JellyfinMPVPlay-macOS-v${{ needs.get-version.outputs.version }}"
          ditto -c -k --sequesterRsrc --keepParent "Jellyfin MPV Play.app" "${NAME}.zip"
          echo "BUNDLE=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-bundle
          path: ${{ env.BUNDLE }}

  release:
    needs: [get-version, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.get-version.outputs.version }}
        run: |
          mkdir -p release-files
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release-files/ \;
          echo "Release files:"
          ls -lh release-files/

          # Use auto-generated changelog if available, fall back to CHANGELOG.md
          if [ -f artifacts/sync-files/changelog-entry.md ]; then
            cat artifacts/sync-files/changelog-entry.md > notes.md
          else
            VER_ESCAPED="${VERSION//./\\.}"
            awk "/^## v${VER_ESCAPED}/{found=1; next} found && /^## v/{exit} found" CHANGELOG.md > notes.md
          fi

          if [ ! -s notes.md ]; then
            echo "## Jellyfin MPV Play v${VERSION}" > notes.md
          fi

          # Prepend Downloads table
          DOWNLOADS="### Downloads\n| Platform | File |\n|----------|------|\n| macOS | \`JellyfinMPVPlay-macOS-v${VERSION}.zip\` |\n| Linux | \`JellyfinMPVPlay-Linux-v${VERSION}.tar.gz\` |\n| Windows | \`JellyfinMPVPlay-Windows-v${VERSION}.zip\` |\n"
          echo -e "$DOWNLOADS" > /tmp/downloads.md
          cat notes.md >> /tmp/downloads.md
          mv /tmp/downloads.md notes.md

          # Append quick start footer
          {
            echo ""
            echo "### Quick Start"
            echo "**macOS:** Unzip, move to Applications, launch. The setup wizard will guide you."
            echo ""
            echo "**Linux:** Extract, edit \`config.js\`, run \`./launch.sh\`. See the included \`.desktop\` file for app launcher integration."
            echo ""
            echo "**Windows:** Extract, edit \`config.js\`, run \`launch.bat\`."
            echo ""
            echo "All bundles include their own Node.js runtime. Only [MPV Player](https://mpv.io/installation/) is required."
            echo ""
            echo "For full documentation, see the [README](https://github.com/MrGameVlogger/jellyfin-mpv-play#readme)."
          } >> notes.md

          # Create or update release (never delete — assets are permanently lost)
          if gh release view "v${VERSION}" -R MrGameVlogger/jellyfin-mpv-play &>/dev/null; then
            gh release edit "v${VERSION}" \
              -R MrGameVlogger/jellyfin-mpv-play \
              --notes-file notes.md
            # Upload any new assets
            gh release upload "v${VERSION}" \
              -R MrGameVlogger/jellyfin-mpv-play \
              --clobber \
              release-files/*
          else
            gh release create "v${VERSION}" \
              -R MrGameVlogger/jellyfin-mpv-play \
              --title "v${VERSION}" \
              --notes-file notes.md \
              --verify-tag \
              release-files/*
          fi
